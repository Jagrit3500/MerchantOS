[server]
fileWatcherType = "none"
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[theme]
base = "dark"
primaryColor = "#00d4aa"
backgroundColor = "#060912"
secondaryBackgroundColor = "#111827"
textColor = "#e2e8f0"
font = "sans serif"

[browser]
gatherUsageStats = false
